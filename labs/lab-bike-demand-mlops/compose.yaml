# Complete MLOps development environment
#
# Services:
# - PostgreSQL
# - FastAPI Prediction API
# - Vizro Monitoring Dashboard
#
# Start:
# docker compose up -d


services:
  postgres:
    image: postgres:17
    container_name: bike-postgres

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "${DATABASE_PORT}:5432"

    volumes:
      - bike_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
    build: .

    container_name: bike-api

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8000:8000"

    restart: unless-stopped

    command:
      [
        "sh",
        "-c",
        "/app/.venv/bin/uvicorn src.api.main:app --host 0.0.0.0 --port 8000",
      ]

  dashboard:
    build: .

    container_name: bike-dashboard

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8050:8050"

    restart: unless-stopped

    command:
      [
        "sh",
        "-c",
        "/app/.venv/bin/python -m src.dashboard.main",
      ]

volumes:
  bike_postgres_data: