services:
  postgres:
    image: postgres:17
    container_name: bike-postgres

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "${DATABASE_PORT}:5432"

    volumes:
      - bike_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
      build: .
      container_name: bike-api

      env_file:
        - .env

      depends_on:
        postgres:
          condition: service_healthy

      ports:
        - "8000:8000"



volumes:
  bike_postgres_data:

